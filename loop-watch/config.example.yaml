# loop-watch — настройки. Скопируйте в config.yaml (он в .gitignore) и заполните.

# Ваш логин на GitHub: свои комментарии, issue и коммиты не считаются новостями.
me: your-github-login

# Чьи комментарии всегда важные (🔴), кроме упоминаний @me — они важные и так.
vip: []

# Часовой пояс: либо timezone (IANA), либо город латиницей. Пусто — берётся системный.
city: Yekaterinburg
# timezone: Asia/Yekaterinburg

# Рабочие часы (местное время). Опрос идёт всегда, уведомления вне часов копятся и приходят утром.
active_hours: [8, 23]

# Токен GitHub — НЕ сюда, а в переменную пользователя Windows GITHUB_TOKEN (это делает setup.cmd).
# Для чужих репозиториев нужен classic-токен с правом repo (fine-grained видит только своего владельца).

# Необязательно: Telegram (уведомления на телефон). Свой бот от @BotFather, его токен — в переменную
# пользователя LOOPWATCH_TG_TOKEN, сюда — chat_id (написать боту, затем getUpdates).
# telegram_chat_id: 123456789

repos:
  - repo: owner/repo
    issues: [1, 2, 100]       # issue, в которых ждём новые комментарии
    # Метки. Не указано или [] — только issue из списка issues. ["any"] — все issue.
    # ["attention!", "bug"] — ещё и issue с этими метками.
    labels: []
    report_new_issues: true   # сообщать о новых issue (и комментариях в них)
    watch_commits: true       # новые коммиты в ветке
    branch: main
    watch_prs: true           # PR: открыт / смерджен / закрыт
