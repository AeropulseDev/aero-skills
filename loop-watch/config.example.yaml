# loop-watch — настройки. Скопируйте в config.yaml (он в .gitignore) и заполните.

# Ваш логин на GitHub: свои комментарии не считаются новостями.
me: your-github-login

# Часовой пояс: либо timezone (IANA), либо город латиницей. Пусто — берётся системный.
city: Yekaterinburg
# timezone: Asia/Yekaterinburg

# Рабочие часы (местное время): вне их проверка молчит. Уберите строку — проверять всегда.
active_hours: [8, 23]

# Токен GitHub. Есть токен — режим token (чистый Python): issue, коммиты, PR. Нет — режим browser
# (агент со встроенным браузером; только issue). Для ЧУЖИХ репозиториев нужен classic-токен с правом
# repo (fine-grained видит только репозитории своего владельца). Можно не писать сюда, а задать
# переменную окружения GITHUB_TOKEN (но агент Claude на компьютере её не видит — тогда здесь).
github_token:

# Необязательно: команда уведомления, {n} — число новых событий. Пример для Windows:
# notify_cmd: msg * "loop-watch: {n} новых событий, см. inbox.md"

repos:
  - repo: owner-git-akk/repo
    issues: [1, 2, 100]       # issue, в которых ждём новые комментарии
    # Метки (только token-режим). Не указано или [] — следим только за issue из списка issues.
    # ["any"] — следим за всеми issue (сначала сообщаем по номерным, потом по остальным).
    # ["attention!", "bug"] — кроме номерных, следим за issue с этими метками (номерные — первыми).
    labels: []
    report_new_issues: true   # сообщать о новых issue в репозитории
    watch_commits: true       # новые коммиты в ветке (только token)
    branch: main
    watch_prs: true           # новые / обновлённые / смердженные PR (только token)
